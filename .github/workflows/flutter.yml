name: Flutter CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  android:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Distribute to testers via Firebase
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_FLUTTER_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          releaseNotes: "Flutter build ${{ github.run_number }} (${{ github.sha }})"
          file: flutter/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: can-can-android-debug
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
      - name: Build release APK (unsigned)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: can-can-android-release-unsigned
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  ios:
    needs: analyze
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: can-can-ios-unsigned
          path: flutter/build/ios/iphoneos/Runner.app
          retention-days: 3
