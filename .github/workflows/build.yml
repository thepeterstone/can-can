name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # platform-36 is pre-installed on ubuntu-latest; licenses still need accepting
      - name: Accept SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        id: gradle_build
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; exit ${PIPESTATUS[0]}

      - name: Post Gradle failure to PR
        if: failure() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(grep -E "error:|Error:|FAILED|Exception|> Task" /tmp/gradle.log | head -60 || tail -60 /tmp/gradle.log)
          gh pr comment "${{ github.event.pull_request.number }}" --repo thepeterstone/can-can \
            --body "**Gradle build failure (run ${{ github.run_id }})**
          \`\`\`
          $LOG
          \`\`\`"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: can-can-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: can-can-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
