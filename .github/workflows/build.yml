name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Diagnose and install Android SDK
        run: |
          set +e
          {
            echo "=== ANDROID_HOME: $ANDROID_HOME"
            echo "=== ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            echo "=== ls cmdline-tools:"
            ls -la "$ANDROID_HOME/cmdline-tools/" 2>&1
            echo "=== find sdkmanager:"
            find "$ANDROID_HOME" -name "sdkmanager" 2>/dev/null
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ -f "$SDKM" ]; then
              echo "=== installed packages:"
              "$SDKM" --list_installed 2>&1 | head -40
              echo "=== accepting licenses"
              yes | "$SDKM" --licenses 2>&1 | tail -5
              echo "=== available android platforms:"
              "$SDKM" --list 2>&1 | grep "platforms;android-" | tail -20
              echo "=== installing platforms;android-36"
              "$SDKM" "platforms;android-36" 2>&1
            else
              echo "sdkmanager NOT found at $SDKM"
            fi
          } | tee /tmp/sdk-diag.txt
          set -e

      - name: Upload SDK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-diagnostics
          path: /tmp/sdk-diag.txt
          retention-days: 3

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.txt; exit ${PIPESTATUS[0]}

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.txt
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: can-can-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
