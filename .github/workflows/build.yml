name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Diagnose Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la ${ANDROID_HOME}/cmdline-tools/ || echo "no cmdline-tools dir"
          find ${ANDROID_HOME} -name "sdkmanager" 2>/dev/null || echo "sdkmanager not found"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -30 || true

      - name: Accept SDK licenses and install platform 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: can-can-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: can-can-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
